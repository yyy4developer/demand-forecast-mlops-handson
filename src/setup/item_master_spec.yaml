#   adi / cv2       : 目標値 (品目単位 = DOM + EXP 合計に対して検証する)
#   mean_qty        : 直近 12 ヶ月の月次平均数量の目標値
#   domestic_only   : true なら EXP チャネルの数量をゼロにする
#   launch_ym       : この月から需要が立ち上がる (それ以前はゼロ)
#   seasonal        : true なら年周期の季節性を付与する (モデル比較で差を出すため)
#   exp_share       : EXP チャネルの数量シェア目標 (domestic_only=false のとき)
# -----------------------------------------------------------------------------
