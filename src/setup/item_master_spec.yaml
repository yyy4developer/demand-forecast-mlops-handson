# =============================================================================
# サンプルデータ仕様 — 架空の産業用機器メーカー「アクアテック工業」
# =============================================================================
# 需要予測ハンズオン用のサンプルデータを、**誰が実行しても同じ結果になる形**で
# 生成するための仕様ファイルです。
#
# 各品目には「需要分類 / ADI / CV2 / 月次平均数量」の目標値が定義されています。
# generate_sample_data.py はこの目標値を再現するように乱数系列を生成し、
# 生成後に実測値を再計算して目標との乖離を検証します。
#
# 用語:
#   ADI (Average Demand Interval) = 需要が発生する平均間隔 (月数)
#       ADI = 全期間の月数 / 需要が発生した月数。1.0 なら毎月需要がある。
#   CV2 (squared Coefficient of Variation) = 非ゼロ需要のばらつき (変動係数の2乗)
#       CV2 = (標準偏差 / 平均)^2。大きいほど数量の振れが激しい。
#
#   Syntetos-Boylan の需要分類 (ADI=1.32 / CV2=0.49 が閾値):
#       smooth       : ADI 小 / CV2 小 — 毎月安定して出る
#       erratic      : ADI 小 / CV2 大 — 毎月出るが数量が振れる
#       intermittent : ADI 大 / CV2 小 — 出ない月がある / 数量は安定
#       lumpy        : ADI 大 / CV2 大 — 出ない月があり、出ると数量も振れる
#       lumpy_severe : lumpy のうち特に CV2 が大きいもの (本仕様の独自区分)
# =============================================================================

meta:
  company: アクアテック工業
  company_slug: aquatech
  description: 産業用機器とその消耗品を国内・海外の 2 チャネルで販売するメーカー
  # 生成期間 (月次・両端含む)
  start_ym: "2020-01"
  end_ym: "2026-08"
  # ハンズオン当日に投入する「新しい月」
  holdout_ym: "2026-08"
  # 乱数シードの基点。品目ごとに base_seed + index*1000 + attempt を使う
  base_seed: 20260913
  # 自己検証の許容誤差 (相対誤差)
  tolerance:
    adi: 0.25
    cv2: 0.35
    mean_qty: 0.20
  # 在庫拠点
  sites:
    - code: TOKYO_DC
      name: 東京物流センター
      domestic: true
    - code: OSAKA_DC
      name: 大阪物流センター
      domestic: true
    - code: OVERSEAS_HUB
      name: 海外中継倉庫
      domestic: false

channels:
  - code: DOM
    name: 国内
    description: 国内の販売代理店・直販向けチャネル。需要は比較的安定している。
  - code: EXP
    name: 海外
    description: 海外の現地代理店向けチャネル。先行注文により大口のスパイクが立つ。

# -----------------------------------------------------------------------------
