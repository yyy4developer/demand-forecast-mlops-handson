# -----------------------------------------------------------------------------
# 在庫・リードタイムの生成パラメータ
# -----------------------------------------------------------------------------
inventory:
  # 安全在庫 = 直近 12 ヶ月の月次平均需要 × safety_stock_months
  safety_stock_months: 1.5
  # 月末在庫 = 安全在庫 × (1 + ノイズ)。ノイズの標準偏差
  closing_qty_noise_sd: 0.45
  # 欠品はこの確率で発生させる (月末在庫が 0 になる)
  stockout_rate: 0.06

lead_time:
  # 拠点ごとの標準リードタイム日数のレンジ (一様分布・整数)
  TOKYO_DC: [3, 10]
  OSAKA_DC: [4, 12]
  OVERSEAS_HUB: [21, 60]
