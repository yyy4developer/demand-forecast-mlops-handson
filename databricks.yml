# =============================================================================
# 需要予測 × MLOps ハンズオン — Databricks Asset Bundle
# =============================================================================
# ハンズオンの「事前構築物」はすべてこの bundle で作られる:
#   - カタログ / 共有スキーマ / landing Volume
#   - サンプルデータ投入ジョブ
#   - bronze → silver → gold のパイプライン (Lakeflow Declarative Pipelines)
#   - 完成見本のダッシュボードと Genie Agent
#   - バッチ推論 / 再学習ジョブの完成見本
#
# 参加者が当日つくるものは bundle には含めない (自分の手で作るのが目的)。
#
# ## 使い方
#
#   databricks bundle validate -t dev -p <profile>
#   databricks bundle deploy   -t dev -p <profile>
#
# ワークスペースの URL は **プロファイルから解決される**ため、ここには書かない。
# 別のワークスペースで使う場合は `databricks auth login` でプロファイルを作り、
# `-p <profile>` を差し替えるだけでよい。
# =============================================================================

bundle:
  name: demand_forecast_mlops_handson

variables:
  catalog:
    description: "ハンズオンで使うカタログ名"
    default: demand_forecast_handson
  shared_schema:
    description: "CSV を置く Volume 専用の共有スキーマ"
    default: fc_shared
  sample_schema:
    description: "完成見本の gold を置くスキーマ (参加者は読み取りのみ)"
    default: fc_sample
  landing_volume:
    description: "CSV を投入する Volume 名"
    default: landing
  participant_group:
    description: "参加者グループ名 (権限付与の対象)"
    default: handson-participants
  warehouse_id:
    description: "ダッシュボード / Genie Agent が使う SQL ウェアハウス ID"
    default: ""

include:
  - resources/*.yml

sync:
  include:
    - notebooks/**
    - src/**
    - data/**
    - prompts/**

targets:
  dev:
    default: true
    presets:
      # ⚠️ `mode: development` は使わない。
      #    development モードはリソース名に "dev_<user>_" を自動で付けるため、
      #    共有スキーマ名が `fc_shared` で固定されている前提
      #    (参加者向け手順・ノートブック・Genie Agent がこの名前を参照する) が崩れる。
      #    ⚠️ `presets.name_prefix: ""` では無効化できない (空文字は未指定と同じ扱い)。
      #    パイプラインを開発モードにする設定だけを明示的に有効化する。
      pipelines_development: true
      trigger_pause_status: PAUSED
