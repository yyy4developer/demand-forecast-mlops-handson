# =============================================================================
# 需要予測 × MLOps ハンズオン — Databricks Asset Bundle
# =============================================================================
# ハンズオンの「事前構築物」はすべてこの bundle で作られる:
#   - カタログ / 共有スキーマ / landing Volume
#   - サンプルデータ投入ジョブ
#   - bronze → silver → gold のパイプライン (Lakeflow Declarative Pipelines)
#   - 完成見本のダッシュボードと Genie Agent
#   - バッチ推論 / 再学習ジョブの完成見本
#
# 参加者が当日つくるものは bundle には含めない (自分の手で作るのが目的)。
#
# ## 使い方
#
#   databricks bundle validate -t dev -p <profile>
#   databricks bundle deploy   -t dev -p <profile>
#
# ⭐⭐ この bundle は **変数を 1 つも渡さずにデプロイできます。**
#    Databricks CLI を持っていなくても、ワークスペース上の Git フォルダから
#    画面の「デプロイ」だけで配置できます（docs/SETUP.md 参照）。
#
# ⚠️ SQL ウェアハウス ID のように環境ごとに変わる値は、ここでは扱いません。
#    ダッシュボードは `notebooks/admin/01_deploy_dashboard` が
#    実行時にウェアハウスを見つけて作ります。
# =============================================================================

bundle:
  name: demand_forecast_mlops_handson

variables:
  catalog:
    description: "ハンズオンで使うカタログ名"
    default: demand_forecast_handson
  warehouse_id:
    # ⚠️ ワークスペースごとに違うため、リポジトリには値を持たせません。
    # ⭐ `notebooks/admin/00_prepare_environment` が
    #    `.databricks/bundle/<target>/variable-overrides.json` に書き出すので、
    #    デプロイ時に何も渡す必要はありません（画面のデプロイでも読まれます）。
    description: "ダッシュボードが使う SQL ウェアハウス ID"
    default: ""
  sample_schema:
    description: "検証済みの見本を全部置くスキーマ (参加者は読み取りのみ)"
    default: fc_sample
  landing_volume:
    description: "CSV を投入する Volume 名"
    default: landing
  participant_group:
    description: "参加者グループ名 (権限付与の対象)"
    default: handson-participants

include:
  - resources/*.yml

sync:
  include:
    - notebooks/**
    - src/**
    - data/**
    - prompts/**

targets:
  dev:
    default: true
    presets:
      # ⚠️ `mode: development` は使わない。
      #    development モードはリソース名に "dev_<user>_" を自動で付けるため、
      #    見本スキーマ名が `fc_sample` で固定されている前提
      #    (参加者向け手順・ノートブック・Genie Agent がこの名前を参照する) が崩れる。
      #    ⚠️ `presets.name_prefix: ""` では無効化できない (空文字は未指定と同じ扱い)。
      #    パイプラインを開発モードにする設定だけを明示的に有効化する。
      pipelines_development: true
      trigger_pause_status: PAUSED
