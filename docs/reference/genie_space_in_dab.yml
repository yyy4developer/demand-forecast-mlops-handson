# ⚠️ これは **参考資料** です。bundle には読み込まれません（`resources/` の外にあります）。
#
# ⭐ 「Genie Agent も DAB で管理できる」ことを示すために残しています。
#    実際の作成は `src/setup/create_genie_space.py` が REST で行います。
#
# ⚠️ DAB に置くと **deploy が 2 回必要**になります。作成 API が参照テーブルの
#    実在を検証するのに、メトリクスビューは deploy 後にしかできないためです。
#    → 1 回目の deploy は必ず失敗し、メトリクスビューを作ってから 2 回目が必要。
#
# ⭐ `resources/` に戻せば DAB 管理に切り替えられます（その場合は
#    セットアップジョブから create_genie_space タスクを外してください）。
#
# ----------------------------------------------------------------------

# 完成見本の Genie Agent
#
# ⭐ 参加者は「これから作るもの」を先に見るために開きます。
#    名前に「見本」を含めているのは、参加者がその文字で探すためです。
#
# ⚠️ 内部の識別子は旧名称のままです（DAB のキーは `genie_spaces`）。
#    製品名は「Genie Agent」です。
#
# ⭐ 渡しているのは**メトリクスビュー 2 本だけ**です。
#    生のファクトテーブルを渡すと結合を誤りやすく、回答精度が落ちます。
#
# ⚠️⚠️ `serialized_space` の形式は公開ドキュメントに無いため、API を試して確認しました。
#    分かったこと:
#      - `version` は 1 か 2。省略すると `ExportConverter supports versions 1 and 2, but got 0`
#      - テーブルは `data_sources.tables[].identifier`（⚠️ `full_name` や `name` は不可）
#      - 指示は `instructions.text_instructions[].content`（⚠️ **文字列の配列**。文字列単体は不可）
#      - ⚠️ エラー `Expected 'START_OBJECT' not 'VALUE_STRING'` は
#        「そのフィールドは存在するが、値がオブジェクト/配列であるべき」という意味
#
# ⭐ ここでは **YAML にインラインで書いています**（別ファイルにすると
#    `${var.catalog}` などの変数が置換されないため）。
#
# ⚠️⚠️⚠️ **1 回目の deploy ではこのリソースだけ失敗します。想定どおりです。**
#
#   Genie Agent の作成 API は、参照するテーブルが **実在するか検証します**。
#   ところが `mv_demand` / `mv_forecast_accuracy` は
#
#     deploy → CSV 投入 → パイプライン実行 → gold テーブル → メトリクスビュー
#
#   という順でできるので、⚠️ **deploy の時点では存在しません**。
#   そのため 1 回目は次のエラーになります（403 PERMISSION_DENIED という
#   表示ですが、⭐ 中身は「テーブルが無い」です）:
#
#     Failed to fetch tables for the agent.
#     Table '<catalog>.fc_sample.mv_demand' does not exist
#
#   ⭐ **他のリソース（スキーマ / Volume / パイプライン / ジョブ / ダッシュボード）は
#      1 回目で全部作られます。** 権限付与も効きます。
#
# ⭐⭐ **対処: メトリクスビューを作ってから、もう一度 deploy してください。**
#    手順は `docs/SETUP.md` の STEP 6.5 にあります。
resources:
  genie_spaces:
    demand_agent_sample:
      title: "[handson] 見本 需要分析エージェント"
      description: "アクアテック工業の需要と予測精度を自然言語で分析するための見本。参加者は同じものを自分のスキーマで作ります。"
      parent_path: /Workspace/Users/${workspace.current_user.userName}
      warehouse_id: ${var.warehouse_id}
      serialized_space:
        version: 2
        data_sources:
          tables:
            - identifier: ${var.catalog}.${var.sample_schema}.mv_demand
            - identifier: ${var.catalog}.${var.sample_schema}.mv_forecast_accuracy
        instructions:
          text_instructions:
            - content:
                - "回答は必ず日本語で返してください。"
                - "数量は整数、比率は小数第 1 位までに丸めてください。"
                - >-
                  予測精度について質問されたときは、誤差率と誤差個数を必ず両方示してください。
                  数量の少ない品目は誤差率が大きく出るため、率だけでは判断を誤ります。
