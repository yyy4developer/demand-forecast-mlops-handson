# CSV の投入先 Volume
#
# 配下は取り込み対象ごとにディレクトリを分ける:
#   shipments/         月次出荷実績        (★ 当日ここに新しい CSV を置く)
#   items/             品目マスタ
#   channels/          チャネル定義
#   inventory/         月末在庫
#   lead_time/         標準リードタイム
#   forecast_baseline/ 前年同月ナイーブのベースライン予測
#   your_own_data/     参加者が自分のデータを置く場所 (自由時間用)
resources:
  volumes:
    landing:
      catalog_name: ${var.catalog}
      schema_name: ${var.shared_schema}
      name: ${var.landing_volume}
      volume_type: MANAGED
      comment: "サンプル CSV と参加者データの取り込み用 Volume"
