# 見本スキーマ
#
# ⭐ ハンズオンのゴールは「**このスキーマを自分のスキーマに再現すること**」です。
#
#   | スキーマ | 中身 | 誰が書くか |
#   |---|---|---|
#   | fc_sample     | ⭐ **検証済みの見本すべて**（CSV の Volume / bronze→gold / メトリクスビュー / モデル / MMF 結果 / ダッシュボード） | 管理者 |
#   | fc_ws_<user>  | ⭐ **各参加者が同じものを作る場所**（Volume も含む） | 参加者自身 |
#
# ⭐ 参加者は見本の Volume から CSV を**自分の Volume にコピー**して取り込みます。
#    だから「見本を見ながら同じものを作る」形になります。
#
# ⚠️ カタログはここでは作りません。Default Storage 構成のメタストアでは
#    API 経由の CREATE CATALOG が失敗するため、
#    `notebooks/admin/00_prepare_environment.py` で SQL から作成します。
#
# 参加者ごとのスキーマと Volume は notebooks/_config.py が実行時に自動作成します。
resources:
  schemas:
    sample:
      catalog_name: ${var.catalog}
      name: ${var.sample_schema}
      comment: "検証済みの見本。参加者はここを読み、自分のスキーマに同じものを作る。"
